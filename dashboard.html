<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: #1e293b; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #334155; }
        .sidebar h2 { color: #38bdf8; margin-bottom: 30px; font-size: 22px; }
        .menu-items a { display: block; color: #94a3b8; text-decoration: none; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; transition: 0.3s; }
        .menu-items a:hover, .menu-items a.active { background: #0284c7; color: #fff; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .storage-box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .storage-bar { background: #334155; height: 10px; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .storage-progress { background: #38bdf8; width: 15%; height: 100%; }
        
        /* Upload Section */
        .upload-section { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; border: 2px dashed #475569; cursor: pointer; }
        .upload-section h3 { margin-bottom: 10px; color: #38bdf8; }
        .upload-section p { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div>
            <h2>Cloud Drive</h2>
            <div class="menu-items">
                <a href="#" class="active">My Files</a>
                <a href="#">Shared with me</a>
                <a href="#">Trash</a>
            </div>
        </div>
        <div style="font-size: 14px; color: #64748b;">Plan: Free (100 GB)</div>
    </div>

    <!-- Main Dashboard -->
    <div class="main-content">
        <div class="header">
            <h1>Welcome Back, User!</h1>
            <button style="background: #ef4444; border: none; padding: 10px 20px; color: white; border-radius: 6px; cursor: pointer; font-weight: bold;">Logout</button>
        </div>

        <!-- Storage Status -->
        <div class="storage-box">
            <p>Storage Used: <strong>15 GB</strong> of 100 GB</p>
            <div class="storage-bar">
                <div class="storage-progress"></div>
            </div>
        </div>

        <!-- Upload Box -->
        <div class="upload-section">
            <h3>Upload Files</h3>
            <p>Drag & Drop files here or click to browse (Connected to Discord Backend)</p>
        </div>
    </div>

</body>
</html>
